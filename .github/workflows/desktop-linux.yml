name: Desktop Linux packages

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build-linux-packages:
    name: Build DEB and RPM
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio rpm xvfb

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Harness and Web artifacts
        run: pnpm run build

      - name: Build Linux desktop packages
        run: bash scripts/build_desktop_linux.sh

      - name: Read desktop version
        id: desktop-version
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Inspect packages and bundled tools
        run: |
          deb=$(find desktop/dist -maxdepth 1 -type f -name '*.deb' -print -quit)
          rpm_package=$(find desktop/dist -maxdepth 1 -type f -name '*.rpm' -print -quit)
          test -n "$deb"
          test -n "$rpm_package"
          rpm_package=$(realpath "$rpm_package")
          dpkg-deb --info "$deb"
          rpm -qip "$rpm_package"
          deb_root=$(mktemp -d)
          rpm_root=$(mktemp -d)
          dpkg-deb -x "$deb" "$deb_root"
          (cd "$rpm_root" && rpm2cpio "$rpm_package" | cpio -idm --quiet)
          deb_node=$(find "$deb_root" -type f -path '*/resources/harness-node/node' -print -quit)
          deb_pnpm=$(find "$deb_root" -type f -path '*/resources/harness-tools/pnpm' -print -quit)
          rpm_node=$(find "$rpm_root" -type f -path '*/resources/harness-node/node' -print -quit)
          rpm_pnpm=$(find "$rpm_root" -type f -path '*/resources/harness-tools/pnpm' -print -quit)
          test -x "$deb_node"
          test -x "$deb_pnpm"
          test -x "$rpm_node"
          test -x "$rpm_pnpm"
          "$deb_node" --version
          "$deb_pnpm" --version
          "$rpm_node" --version
          "$rpm_pnpm" --version
          sha256sum --check desktop/dist/SHA256SUMS-Linux.txt
          deb_app=$(find "$deb_root" -type f -path '*/opt/*/deepseek-harness' -print -quit)
          test -x "$deb_app"
          smoke_home=$(mktemp -d)
          set +e
          DEEPSEEK_HARNESS_USER_DATA_DIR="$smoke_home" timeout 20s xvfb-run -a "$deb_app" --no-sandbox > desktop-smoke.log 2>&1
          smoke_status=$?
          set -e
          if [[ "$smoke_status" -ne 124 && "$smoke_status" -ne 143 ]]; then
            cat desktop-smoke.log
            exit "$smoke_status"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-linux-${{ steps.desktop-version.outputs.value }}
          path: |
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/SHA256SUMS-Linux.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
