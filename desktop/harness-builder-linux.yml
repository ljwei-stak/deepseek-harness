extends: ./harness-builder.yml
linux:
  icon: assets/app-icon.png
  syncDesktopName: true
  category: Development
  maintainer: Jianwei Li <ljwei-stak@users.noreply.github.com>
  vendor: ljwei-stak
  executableName: deepseek-harness
  synopsis: Multi-model workspace with Model Router, GALGame, and dsh-web-ui
  description: DeepSeek Harness desktop client with a bundled local runtime, Model Router + GALGame, the independent plugin market, and the complete dsh-web-ui plugin suite.
  target:
    - deb
    - rpm
deb:
  compression: gz
  artifactName: DeepSeek-Harness-ModelRouter-GALGame-${version}-Linux-amd64.${ext}
rpm:
  compression: gzip
  artifactName: DeepSeek-Harness-ModelRouter-GALGame-${version}-Linux-x86_64.${ext}
