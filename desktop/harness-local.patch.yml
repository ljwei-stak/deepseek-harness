# Desktop-local sessions use the deterministic title fallback. Calling the
# selected model again for a title races the real first answer and can exhaust
# single-concurrency or free-tier OpenCode Zen routes.
- id: session-title-llm
  disabled: true

# The desktop launcher adds the three shipped packages to
# dsh.profile.bundles before starting the Web profile. They must be bundles,
# rather than ordinary insert rows, so Harness also applies each package's
# declared cordis.patch.yml and its complete browser-plugin roster.
